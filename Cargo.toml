[package]
name = "timber"
version = "0.1.1"
license = "MIT"
edition = "2021"
description = "SolidCraft plugin: standard timber sections placed parallel or at 90 degrees to a selected timber"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
